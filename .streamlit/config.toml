[theme]
base = "light"
primaryColor = "#3C4A2A"
backgroundColor = "#F0ECE1"
secondaryBackgroundColor = "#F9F7F0"
textColor = "#241F19"
linkColor = "#3C4A2A"
linkUnderline = true
redColor = "#B14A3D"
redBackgroundColor = "#ECD8D3"
redTextColor = "#8C342B"
yellowColor = "#C2872B"
yellowBackgroundColor = "#F0E2C4"
yellowTextColor = "#845A1A"
blueColor = "#35577A"
blueBackgroundColor = "#DBE3EA"
blueTextColor = "#35577A"
greenColor = "#2F6B3F"
greenBackgroundColor = "#DFE8D9"
greenTextColor = "#2F6B3F"
grayColor = "#7A6F5E"
grayBackgroundColor = "#E8E2D2"
grayTextColor = "#4A4137"
font = "sans-serif"
baseFontSize = 17
baseFontWeight = 400
headingFontSizes = ["1.7rem", "1.2rem", "1.05rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [630, 630, 630, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
baseRadius = "0.2rem"
buttonRadius = "0.2rem"
borderColor = "#B3A890"
dataframeBorderColor = "#B3A890"
dataframeHeaderBackgroundColor = "#E8E2D2"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
  "#35577A",
  "#52633C",
  "#845A1A",
  "#8C342B",
  "#6B4A5C",
  "#4A6B5C",
  "#7A6F5E",
]

[theme.sidebar]
primaryColor = "#3C4A2A"
backgroundColor = "#E8E2D2"
secondaryBackgroundColor = "#F9F7F0"
textColor = "#241F19"
linkColor = "#3C4A2A"
borderColor = "#B3A890"
showWidgetBorder = true

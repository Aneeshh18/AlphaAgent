name: Repository secret hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  path-metadata-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject secret-shaped indexed paths
        shell: bash
        run: python3 scripts/verify_repository_hygiene.py --git-index

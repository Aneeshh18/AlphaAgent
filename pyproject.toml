[project]
name = "ai-investment-os"
version = "0.3.0"
description = "In-house, minimal-cost investment intelligence system (Path B build)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aneesh Sahu" }]

dependencies = [
    # --- Data store ---
    "duckdb>=1.5.4,<1.6",     # schema/constraint contract is certified on 1.5.x
    "pyarrow>=17.0.0",        # parquet I/O + arrow interop

    # --- HTTP / data fetching ---
    "httpx>=0.27.0",          # async-capable HTTP client (429 backoff lives here)
    "tenacity>=8.5.0",        # retry/backoff policy
    "yfinance>=0.2.40",       # EOD prices primary
    "fredapi>=0.5.2",         # macro data
    "pandas>=2.2.0",          # dataframes (ingest layer + interop)
    "polars>=1.5.0",          # fast factor computation (later)

    # --- Config / CLI ---
    "python-dotenv>=1.0.1",   # load .env secrets
    "typer>=0.12.5",          # CLI framework
    "rich>=13.7.0",           # pretty terminal output
    "pydantic>=2.7.0",        # validated config + typed rows
    "pydantic-settings>=2.3.0",  # env-based config loader

    # --- Logging ---
    "structlog>=24.1.0",      # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
dashboard = [
    "streamlit>=1.58.0,<2.0",
    "plotly>=5.24.0",
]

[project.scripts]
aios = "aios.cli:app"        # CLI entrypoint: `aios <command>`

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/aios/risk/scenarios/*.json",
    "src/aios/schemas/*.json",
]
exclude = [
    "/.zcode/**",
    "/.env",
    "/.env.*",
    "/data/**",
    "/logs/**",
    "/backups/**",
    "/runtime/**",
    "/snapshots/**",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.keystore",
    "**/*.ppk",
    "**/*private-key*.pem",
    "**/*private_key*.pem",
    "**/*-key.pem",
    "**/*_key.pem",
    "**/.aws/**",
    "**/.azure/**",
    "**/.config/gcloud/**",
    "**/.config/gh/**",
    "**/.docker/config.json",
    "**/.gnupg/**",
    "**/.kube/**",
    "**/.password-store/**",
    "**/.ssh/**",
    "**/.terraform.d/**",
    "**/.streamlit/secrets.toml",
    "**/.streamlit/secrets.*.toml",
    "**/.git-credentials",
    "**/.netrc",
    "**/_netrc",
    "**/.npmrc",
    "**/.pypirc",
    "**/pip.conf",
    "**/kubeconfig",
    "**/credentials",
    "**/credentials.json",
    "**/credentials.tfrc.json",
    "**/application_default_credentials.json",
    "**/service-account*.json",
    "**/service_account*.json",
    "**/token.json",
    "**/*.duckdb",
    "**/*.duckdb.wal",
    "**/*.sqlite",
    "**/*.sqlite-shm",
    "**/*.sqlite-wal",
    "**/*.sqlite3",
    "**/*.sqlite3-shm",
    "**/*.sqlite3-wal",
    "**/*.db",
    "**/*.db-shm",
    "**/*.db-wal",
    "**/*.wal",
    "**/*.log",
    "**/*.bak",
    "**/*.backup",
    "**/*.dump",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
